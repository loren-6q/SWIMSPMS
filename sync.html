<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTA Sync Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Roboto+Condensed:wght@400;700;900&display=swap');
        body { font-family: 'Roboto Condensed', sans-serif; background: #f1f5f9; color: #1e293b; }
        
        @layer components {
            .btn-base { @apply px-4 py-2 rounded-lg font-black text-sm uppercase shadow-sm flex items-center justify-center gap-2 transition-colors cursor-pointer; }
            .btn-blue { @apply btn-base bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/30; }
            .btn-slate { @apply btn-base bg-slate-200 hover:bg-slate-300 text-slate-700; }
        }

        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; display: none; }
        .loading-overlay.active { display: flex; pointer-events: auto; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Grid Styles */
        table { border-spacing: 0; width: 100%; }
        th, td { padding: 4px 0px; text-align: center; border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; vertical-align: middle; }
        .frozen-col { position: sticky; left: 0; background: #f8fafc; z-index: 10; text-align: left; border-right: 2px solid #94a3b8; padding: 4px 6px; }
        .frozen-row { position: sticky; top: 0; background: #1e293b; color: white; z-index: 20; }
        .frozen-corner { position: sticky; top: 0; left: 0; background: #0f172a; color: white; z-index: 30; border-right: 2px solid #94a3b8; padding: 4px 6px; }
        
        .cell-changed { background-color: #eff6ff !important; } /* Soft Blue */
        .cell-urgent { background-color: #fef2f2 !important; }  /* Soft Red */
    </style>
</head>
<body class="p-2 sm:p-4 h-screen flex flex-col overflow-hidden">
    <div id="loader" class="loading-overlay active"><div class="spinner"></div><div id="sync-status" class="mt-4 font-black text-blue-800 uppercase tracking-widest text-center">CONNECTING...</div></div>

    <div class="flex items-center justify-between bg-slate-900 p-3 sm:p-4 rounded-t-xl shrink-0 text-white">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500 p-1.5 rounded"><i data-lucide="refresh-cw" class="text-white"></i></div>
            <h1 class="font-black uppercase tracking-widest text-lg sm:text-xl">OTA Sync & Auditor</h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="reset-dismissed-btn" onclick="window.resetDismissed()" class="hidden text-xs font-bold text-amber-400 hover:text-amber-300 uppercase underline transition-colors">Reset Dismissed Bookings</button>
            <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white uppercase transition-colors">← Back to PMS</a>
        </div>
    </div>
    
    <div class="flex-1 flex flex-col gap-4 bg-white p-3 border-x border-b border-slate-300 rounded-b-xl shadow-xl min-h-0 overflow-hidden">
        
        <!-- AUDITOR PANEL (Stacked on top, naturally grows to push down grid) -->
        <div class="w-full flex flex-col border border-slate-300 rounded-lg shrink-0 bg-slate-50">
            <div class="bg-slate-200 p-2 px-3 font-black text-slate-700 uppercase flex items-center justify-between shrink-0 border-b border-slate-300">
                <span class="text-sm">1. Missing Booking Auditor</span>
                <span class="text-[10px] text-slate-500">Paste Extranet list below</span>
            </div>
            <div class="p-3 flex flex-col gap-3">
                <textarea id="audit-text" class="w-full h-16 sm:h-20 bg-white border border-slate-300 rounded p-2 outline-none focus:ring-2 focus:ring-blue-500 whitespace-pre text-xs text-slate-400 font-mono resize-none transition-all" placeholder="Paste Extranet data here..." oninput="window.checkMissing()"></textarea>
                <!-- Removed max height and internal scrollbar so it naturally pushes down the grid below -->
                <div id="audit-result" class="flex flex-col gap-2"></div>
            </div>
        </div>

        <!-- ACTION LIST MATRIX (Bottom, takes rest of screen) -->
        <div class="w-full flex-1 flex flex-col border border-slate-300 rounded-lg min-h-0 relative">
            <div class="bg-slate-200 p-2 font-black text-slate-700 uppercase flex flex-wrap items-center justify-between gap-2 shrink-0 border-b border-slate-300">
                <span class="pl-2 text-sm">2. Live Availability Matrix</span>
                <div class="flex gap-2">
                    <select id="grid-filter" class="btn-slate !py-1.5 !px-3 !text-xs outline-none shadow-sm cursor-pointer" onchange="window.renderGrid()">
                        <option value="changes">Show Changes Only</option>
                        <option value="urgent">Show Urgent Only (0-2 left)</option>
                        <option value="all">Show All Dates</option>
                    </select>
                    <button onclick="window.markSynced()" class="btn-blue !py-1.5 !px-4 !text-xs shadow-md"><i data-lucide="check-check" size="14"></i> Mark Synced</button>
                </div>
            </div>
            
            <div class="flex-1 overflow-auto bg-slate-50 relative p-0 overscroll-none" id="matrix-container">
                <table id="sync-table">
                    <thead id="sync-head"></thead>
                    <tbody id="sync-body"></tbody>
                </table>

                <div id="no-changes-msg" class="hidden absolute inset-0 flex items-center justify-center bg-slate-50/95 z-40">
                    <div class="text-center p-6 bg-white rounded-xl shadow-xl border border-slate-200">
                        <div class="bg-green-100 text-green-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3"><i data-lucide="shield-check" size="32"></i></div>
                        <h3 id="no-data-title" class="text-2xl font-black text-slate-800 uppercase tracking-tight">Everything is Synced</h3>
                        <p id="no-data-desc" class="text-sm font-bold text-slate-500 mt-1">No changes detected since your last sync.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CRITICAL: Ensure your Firebase Rules are updated to allow access to 'ota_sync' collection
        const firebaseConfig = { apiKey: "AIzaSyCyz--TlQZf_d-YNxhtGCV29LuFoRBfEeU", authDomain: "swimspms.firebaseapp.com", projectId: "swimspms", storageBucket: "swimspms.firebasestorage.app", messagingSenderId: "989960113115", appId: "1:989960113115:web:a99e08a23a36ff4289f5fe" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const appId = 'hotel-pms-v1';
        
        let staff = []; let snapshotData = {}; let liveInventory = {}; let viewDates = []; let rawTypes = []; let totalRoomsByType = {};
        let dismissedIds = [];
        
        // Exact matched arrays from main app
        const rawRooms = "B01|Oceanfront King|KING|2|101^A01|Oceanfront King|KING|1|102^A02|Oceanfront King|KING|1|103^B02|Oceanfront Twin|TWIN|2|201^B03|Oceanview King Room|KING|2|301^B05|Oceanview King Room|KING|2|302^B07|Oceanview King Room|KING|2|303^A03|Oceanview King Room|KING|1|304^A04|Oceanview King Room|KING|1|305^A06|Oceanview King Room|KING|1|306^A08|Oceanview King Room|KING|1|307^A10|Oceanview King Room|KING|1|308^A12|Oceanview King Room|KING|1|309^C206|Oceanview King Room|KING|2|310^C306|Oceanview King Room|KING|3|311^C311|Oceanview King Room|KING|3|312^B04|Oceanview Twin Room|TWIN|2|401^B06|Oceanview Twin Room|TWIN|2|402^B08|Oceanview Twin Room|TWIN|2|403^C212|Oceanview Twin Room|TWIN|2|404^A05|Partial Oceanview King Room|KING|1|501^A07|Partial Oceanview King Room|KING|1|502^A09|Partial Oceanview King Room|KING|1|503^A11|Partial Oceanview King Room|KING|1|504^C203|Partial Oceanview King Room|KING|2|505^C204|Partial Oceanview King Room|KING|2|506^C205|Partial Oceanview King Room|KING|2|507^B09|Gardenview King Room|KING|2|601^B11|Gardenview King Room|KING|2|602^B13|Gardenview King Room|KING|2|603^B15|Gardenview King Room|KING|2|604^B17|Gardenview King Room|KING|2|605^B19|Gardenview King Room|KING|2|606^B21|Gardenview King Room|KING|2|607^B22|Gardenview King Room|KING|2|608^B10|Gardenview Twin Room|TWIN|2|701^B12|Gardenview Twin Room|TWIN|2|702^B14|Gardenview Twin Room|TWIN|2|703^B16|Gardenview Twin Room|TWIN|2|704^B18|Gardenview Twin Room|TWIN|2|705^B20|Gardenview Twin Room|TWIN|2|706^C201|Gardenview Twin Room|TWIN|2|707^C202|Gardenview Twin Room|TWIN|2|708^C207|Gardenview Twin Room|TWIN|2|709^C208|Gardenview Twin Room|TWIN|2|710^C209|Gardenview Twin Room|TWIN|2|711^C210|Gardenview Twin Room|TWIN|2|712^C211|Gardenview Twin Room|TWIN|2|713^C101|Gardenview Twin Room|TWIN|1|714^C307|Partial Oceanview Triple Room|BUNK+T|3|801^C308|Partial Oceanview Triple Room|BUNK+T|3|802^C305|Partial Oceanview Triple Room|K+T|3|803^C309|Partial Oceanview Triple Room|K+T|3|804^C310|Partial Oceanview Triple Room|K+T|3|805^C301-1|Standard Quad Dorm|QUAD|3|901^C301-2|Standard Quad Dorm|QUAD|3|902^C301-3|Standard Quad Dorm|QUAD|3|903^C301-4|Standard Quad Dorm|QUAD|3|904^C302-1|Standard Quad Dorm|QUAD|3|905^C302-2|Standard Quad Dorm|QUAD|3|906^C302-3|Standard Quad Dorm|QUAD|3|907^C302-4|Standard Quad Dorm|QUAD|3|908^C303-1|Standard Quad Dorm|QUAD|3|909^C303-2|Standard Quad Dorm|QUAD|3|910^C303-3|Standard Quad Dorm|QUAD|3|911^C303-4|Standard Quad Dorm|QUAD|3|912^C304-1|Standard Quad Dorm|QUAD|3|913^C304-2|Standard Quad Dorm|QUAD|3|914^C304-3|Standard Quad Dorm|QUAD|3|915^C304-4|Standard Quad Dorm|QUAD|3|916^D01|BUNGALOWS||1|1001^D02|BUNGALOWS||1|1002^D03|BUNGALOWS||1|1003^D04|BUNGALOWS||1|1004^D05|BUNGALOWS||1|1005^D06|BUNGALOWS||1|1006^D07|BUNGALOWS||1|1007^D08|BUNGALOWS||1|1008^D09|BUNGALOWS||1|1009^D10|BUNGALOWS||1|1010^D11|BUNGALOWS||1|1011";
        const hotelRooms = rawRooms.split('^').map(r => { const p = r.split('|'); return { id: p[0], type: p[1] }; });
        hotelRooms.forEach(r => { 
            if (!rawTypes.includes(r.type)) rawTypes.push(r.type);
            totalRoomsByType[r.type] = (totalRoomsByType[r.type] || 0) + 1;
        });

        const parseYMD = (str) => { if(!str) return 0; const p = str.split('-'); return Date.UTC(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2])); };
        const mNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

        signInAnonymously(auth).then(() => {
            getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ota_sync', 'baseline')).then(snap => {
                if(snap.exists()) {
                    snapshotData = snap.data().matrix || {};
                    dismissedIds = snap.data().dismissed || [];
                    updateDismissedUI();
                }
                
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'staff'), (usersSnap) => {
                    staff = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    calculateLiveInventory();
                    document.getElementById('loader').classList.remove('active');
                });
            }).catch(e => {
                document.getElementById('sync-status').innerText = 'DB PERMISSION ERROR';
                alert("Firebase Rules block reading 'ota_sync'. Please update rules as discussed.");
            });
        }).catch(() => { document.getElementById('sync-status').innerText = 'AUTH ERROR'; });

        const updateDismissedUI = () => {
            const btn = document.getElementById('reset-dismissed-btn');
            if (dismissedIds.length > 0) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
        };

        window.dismissBooking = async (id) => {
            if (!dismissedIds.includes(id)) dismissedIds.push(id);
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ota_sync', 'baseline'), { matrix: snapshotData, dismissed: dismissedIds, updatedAt: new Date().toISOString() }, { merge: true });
                updateDismissedUI();
                window.checkMissing();
            } catch(e) {
                alert("Failed to dismiss. Check database permissions.");
            }
        };

        window.resetDismissed = async () => {
            dismissedIds = [];
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ota_sync', 'baseline'), { matrix: snapshotData, dismissed: dismissedIds, updatedAt: new Date().toISOString() }, { merge: true });
                updateDismissedUI();
                window.checkMissing();
            } catch(e) {
                alert("Failed to reset. Check database permissions.");
            }
        };

        const calculateLiveInventory = () => {
            liveInventory = {}; viewDates = [];
            const today = new Date(); today.setHours(12,0,0,0);
            
            for(let i=0; i<240; i++) {
                let d = new Date(today); d.setDate(d.getDate() + i);
                let dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                viewDates.push(dStr);
                
                liveInventory[dStr] = {};
                rawTypes.forEach(t => liveInventory[dStr][t] = totalRoomsByType[t]);
            }

            const activeStaff = staff.filter(s => s.status !== 'cancelled' && s.status !== 'noshow');
            
            activeStaff.forEach(s => {
                if(!s.checkIn || !s.checkOut) return;
                const inMs = parseYMD(s.checkIn), outMs = parseYMD(s.checkOut);
                
                const rList = s.rooms?.length ? s.rooms : (s.room ? [s.room] : []);
                const typesToDeduct = [];
                
                if (rList.length > 0 && rList[0] !== "") {
                    rList.forEach(rid => {
                        let actualId = rid;
                        if (actualId.startsWith('C')) actualId = actualId.substring(1);
                        else if (/^[ABFD]0\d$/.test(actualId)) actualId = actualId[0] + actualId.substring(2);
                        
                        const roomDef = hotelRooms.find(hr => hr.id === actualId || hr.id === rid);
                        if(roomDef) typesToDeduct.push(roomDef.type);
                    });
                } else if (s.bookedType) {
                    let bt = s.bookedType.toUpperCase();
                    let inferred = null;
                    if (bt.includes("DORMITORY") || bt.includes("4-BED") || bt.includes("DORM")) inferred = "Standard Quad Dorm"; 
                    else if (bt.includes("TRIPLE")) inferred = "Partial Oceanview Triple Room"; 
                    else if (bt.includes("SIDE SEA VIEW") || (bt.includes("PARTIAL") && !bt.includes("TWIN") && !bt.includes("TRIPLE"))) inferred = "Partial Oceanview King Room"; 
                    else if (bt.includes("DELUXE TWIN") || (bt.includes("OCEANVIEW") && bt.includes("TWIN"))) inferred = "Oceanview Twin Room"; 
                    else if (bt.includes("DELUXE DOUBLE") || (bt.includes("OCEANVIEW") && !bt.includes("TWIN"))) inferred = "Oceanview King Room"; 
                    else if (bt.includes("GARDEN") && bt.includes("TWIN")) inferred = "Gardenview Twin Room"; 
                    else if (bt.includes("GARDEN") && !bt.includes("TWIN")) inferred = "Gardenview King Room"; 
                    else if (bt.includes("OCEANFRONT")) { inferred = bt.includes("TWIN") ? "Oceanfront Twin" : "Oceanfront King"; } 
                    else if (bt.includes("BUNGALOW")) inferred = "BUNGALOWS";
                    
                    if(inferred) {
                        for(let k=0; k < (s.rooms?.length || 1); k++) typesToDeduct.push(inferred);
                    }
                }

                viewDates.forEach(dStr => {
                    const dMs = parseYMD(dStr);
                    if (dMs >= inMs && dMs < outMs) {
                        typesToDeduct.forEach(t => {
                            if(liveInventory[dStr][t] > 0) liveInventory[dStr][t]--;
                        });
                    }
                });
            });

            window.renderGrid();
        };

        window.renderGrid = () => {
            const filter = document.getElementById('grid-filter').value;
            const head = document.getElementById('sync-head');
            const body = document.getElementById('sync-body');
            const noMsg = document.getElementById('no-changes-msg');
            
            head.innerHTML = ''; body.innerHTML = '';
            
            let colsToShow = [];
            viewDates.forEach(d => {
                let show = false;
                if (filter === 'all') show = true;
                else {
                    rawTypes.forEach(t => {
                        let live = liveInventory[d][t] || 0;
                        let snap = snapshotData[d] && snapshotData[d][t] !== undefined ? snapshotData[d][t] : totalRoomsByType[t];
                        let isUrgent = live <= 2 && totalRoomsByType[t] > 2;
                        if (filter === 'changes' && live !== snap) show = true;
                        if (filter === 'urgent' && isUrgent) show = true;
                    });
                }
                if(show) colsToShow.push(d);
            });

            if (colsToShow.length === 0) {
                noMsg.classList.remove('hidden');
                const title = document.getElementById('no-data-title');
                const desc = document.getElementById('no-data-desc');
                if(title && desc) {
                    if (filter === 'urgent') {
                        title.innerText = "NO URGENT DATES";
                        desc.innerText = "You have plenty of availability everywhere.";
                    } else {
                        title.innerText = "EVERYTHING IS SYNCED";
                        desc.innerText = "No changes detected since your last sync.";
                    }
                }
                return;
            } else {
                noMsg.classList.add('hidden');
            }

            // HEADER ROW: Skinny columns (30% skinnier)
            let trHead = `<tr class="frozen-row"><th class="frozen-corner w-32 min-w-[10rem] max-w-[14rem] text-sm whitespace-normal break-words text-left">ROOM TYPE</th>`;
            colsToShow.forEach(d => {
                const dt = new Date(d + "T12:00:00");
                // Shrunk padding to px-0, enforced width w-[32px] min-w-[32px]
                trHead += `<th class="w-[32px] min-w-[32px] px-0 py-1 leading-tight text-center border-b border-slate-400"><span class="text-blue-300 text-[10px] uppercase font-bold tracking-tight block">${mNames[dt.getMonth()]}</span><span class="text-sm font-black">${dt.getDate()}</span></th>`;
            });
            trHead += `</tr>`;
            head.innerHTML = trHead;

            // BODY ROWS: Wrapped room names, larger text for numbers
            rawTypes.forEach(t => {
                let tr = `<tr><td class="frozen-col font-bold text-xs leading-snug whitespace-normal break-words" title="${t}">${t}<br><span class="text-slate-400 font-normal text-[10px] uppercase mt-1 inline-block">Total Capacity: ${totalRoomsByType[t]}</span></td>`;
                colsToShow.forEach(d => {
                    let live = liveInventory[d][t] || 0;
                    let snap = snapshotData[d] && snapshotData[d][t] !== undefined ? snapshotData[d][t] : totalRoomsByType[t];
                    let isUrgent = live <= 2 && totalRoomsByType[t] > 2;
                    
                    let cellClass = ""; let content = `<span class="font-bold text-sm text-slate-700">${live}</span>`;
                    
                    if (live !== snap) {
                        cellClass = "cell-changed";
                        content = `<div class="flex flex-col items-center justify-center leading-none"><span class="text-[10px] font-bold text-blue-400 line-through mb-0.5">${snap}</span><span class="font-black text-blue-700 text-base">${live}</span></div>`;
                    }
                    if (filter === 'urgent' && isUrgent) {
                        cellClass += " cell-urgent";
                        content = `<span class="font-black text-red-700 text-base">${live}</span>`;
                    }
                    if (live !== snap && filter === 'urgent' && isUrgent) {
                        content = `<div class="flex flex-col items-center justify-center leading-none"><span class="text-[10px] font-bold text-red-400 line-through mb-0.5">${snap}</span><span class="font-black text-red-700 text-base">${live}</span></div>`;
                    }
                    
                    tr += `<td class="${cellClass}">${content}</td>`;
                });
                tr += `</tr>`;
                body.innerHTML += tr;
            });
            
            lucide.createIcons();
        };

        window.markSynced = async () => {
            if(!confirm("Mark all current availability as synced? This will clear your 'Changes' list until new bookings arrive.")) return;
            document.getElementById('loader').classList.add('active');
            document.getElementById('sync-status').innerText = 'SAVING SYNC...';
            
            snapshotData = JSON.parse(JSON.stringify(liveInventory));
            try {
                // Safely save snapshot to the dedicated ota_sync configuration folder
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ota_sync', 'baseline'), { matrix: snapshotData, dismissed: dismissedIds, updatedAt: new Date().toISOString() });
                window.renderGrid();
            } catch(e) {
                alert("Save failed. Check permissions on 'ota_sync' collection.");
            }
            document.getElementById('loader').classList.remove('active');
        };

        window.checkMissing = () => {
            const text = document.getElementById('audit-text').value;
            const resultDiv = document.getElementById('audit-result');
            if (!text.trim()) { resultDiv.innerHTML = ''; return; }

            let lines = text.split(/[\n\r]+/).map(l => l.trim()).filter(Boolean);
            let foundIds = new Set();
            let missingHtml = [];
            let missingCount = 0;

            // Blacklist property ID and known false positives
            const ignoreIds = ['16646458'];

            // Extract numeric strings that are at least 8 digits long
            const numRegex = /\d{8,20}/g;
            
            for (let i = 0; i < lines.length; i++) {
                let match;
                while ((match = numRegex.exec(lines[i])) !== null) {
                    let rawNum = match[0];
                    // If it is massively long (squished text), pull the last 10 digits as the ID
                    let id = rawNum.length > 11 ? rawNum.slice(-10) : rawNum;
                    
                    if (ignoreIds.includes(id) || dismissedIds.includes(id)) continue;

                    // Check if it already exists in our PMS database
                    let exists = staff.some(s => s.bookId === id || s.id === id);
                    if (!exists && !foundIds.has(id)) {
                        foundIds.add(id);
                        
                        let guestName = "UNKNOWN GUEST";
                        
                        // Trace backwards to find "adult" or "child", which implies the Guest Name is immediately above it
                        for (let j = i; j >= Math.max(0, i - 12); j--) {
                            if (/\b(adult|child|adults|children)\b/i.test(lines[j])) {
                                if (j - 1 >= 0) {
                                    // Found the line containing the guest's name! Strip everything except pure letters.
                                    let rawLine = lines[j - 1];
                                    guestName = rawLine
                                        .replace(/THB/gi, '')
                                        .replace(/Payment via Booking\.com/i, '')
                                        .replace(/Bank transfer/i, '')
                                        .replace(/StatusPriceCommission and chargesBooking number/i, '')
                                        .replace(/[\d,.]+/g, '') // strip all numbers and commas
                                        .trim();
                                }
                                break;
                            }
                        }
                        if(!guestName || guestName.length < 2) guestName = "UNKNOWN GUEST";
                        
                        missingCount++;
                        missingHtml.push(
                            `<div class="bg-red-50 px-4 py-3 rounded-lg border border-red-200 shadow-sm flex items-center justify-between gap-4">
                                <div class="font-bold text-sm text-red-900 truncate">
                                    <span class="mr-2 text-red-500">➔</span> ${guestName} <span class="text-red-400 font-mono text-xs ml-1">(${id})</span>
                                </div>
                                <button onclick="window.dismissBooking('${id}')" class="px-3 py-1.5 bg-white hover:bg-slate-100 text-slate-500 text-[10px] font-black uppercase rounded shadow-sm border border-slate-200 transition-colors shrink-0 flex items-center gap-1">
                                    Dismiss <i data-lucide="x" size="12"></i>
                                </button>
                            </div>`
                        );
                    }
                }
            }

            if (missingCount === 0) {
                resultDiv.innerHTML = `
                    <div class="bg-emerald-50 border-2 border-emerald-500 text-emerald-800 p-4 rounded-xl shadow-sm text-center">
                        <div class="font-black text-xl mb-1 flex items-center justify-center gap-2">
                            <i data-lucide="check-circle" size="24" class="text-emerald-500"></i> ALL CLEAR
                        </div>
                        <p class="font-bold text-sm text-emerald-600">Every booking in this list is accounted for.</p>
                    </div>`;
            } else {
                resultDiv.innerHTML = `
                    <div class="bg-rose-50 border-2 border-rose-500 p-4 rounded-xl shadow-sm">
                        <div class="font-black text-lg text-rose-800 mb-3 flex items-center gap-2">
                            <i data-lucide="alert-triangle" size="20" class="text-rose-600"></i> ${missingCount} MISSING BOOKING${missingCount > 1 ? 'S' : ''} FOUND
                        </div>
                        <div class="flex flex-col gap-2">
                            ${missingHtml.join('')}
                        </div>
                    </div>`;
            }
            lucide.createIcons();
        };

        lucide.createIcons();
    </script>
</body>
</html>
