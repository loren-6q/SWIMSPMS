<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIMS | A Social Beach Resort</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;600;700;900&family=Inter:wght@400;500;600&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; color: #334155; }
        
        /* Typography System */
        h1, h2, h3, .font-display { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Montserrat', sans-serif; }
        
        /* Hero Section Styling */
        .hero-bg {
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.85)), url('https://loren-6q.github.io/SWIMSPMS/pics/CoverPhoto.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @layer components {
            .input-base { @apply w-full bg-slate-50 border border-slate-300 font-sans font-semibold text-sm px-4 py-3 rounded-lg outline-none focus:ring-2 focus:ring-slate-800 transition-all; }
            .label-base { @apply text-[10px] font-mono font-black text-slate-500 mb-1 uppercase tracking-widest block; }
            .btn-primary { @apply px-8 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-mono font-bold text-xs uppercase tracking-widest shadow-lg shadow-slate-900/20 transition-all active:scale-95 text-center; }
        }

        .spinner { width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #0f172a; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-200/50 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-0.5">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3 cursor-pointer" onclick="window.scrollTo(0,0)">
                    <img src="https://loren-6q.github.io/SWIMSPMS/pics/SWIMSBanner.png" alt="SWIMS Logo" class="h-[72px] w-auto object-contain">
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#" class="font-mono font-bold text-[11px] text-slate-600 hover:text-slate-900 uppercase tracking-[0.2em] transition-colors">Rooms</a>
                    <a href="#" class="font-mono font-bold text-[11px] text-slate-600 hover:text-slate-900 uppercase tracking-[0.2em] transition-colors">Experience</a>
                    <a href="#" class="font-mono font-bold text-[11px] text-slate-600 hover:text-slate-900 uppercase tracking-[0.2em] transition-colors">Location</a>
                </div>
                <button onclick="document.getElementById('search-widget').scrollIntoView({behavior: 'smooth'})" class="btn-primary !py-2.5 !px-6">Book Now</button>
            </div>
        </div>
    </nav>

    <div class="hero-bg relative pt-32 pb-20 lg:pt-48 flex flex-col items-center justify-center min-h-screen">
        <div class="relative z-10 text-center px-4 max-w-4xl mx-auto flex flex-col items-center mb-16">
            <h1 class="font-display text-5xl md:text-7xl text-white mb-6 tracking-wide drop-shadow-lg leading-tight font-semibold">Stay Wild.<br><span class="italic font-light text-slate-200">Stay Social.</span></h1>
            <p class="text-lg md:text-xl text-slate-200 font-sans font-light mb-10 max-w-2xl drop-shadow">The ultimate beachfront playground on Koh Phangan. Private bungalows, premium dorms, and an iconic infinity pool steps from the ocean.</p>
        </div>

        <!-- Search Widget -->
        <div id="search-widget" class="relative z-20 w-full max-w-4xl mx-auto px-4 translate-y-8">
            <div class="glass-panel p-6 md:p-8 rounded-2xl shadow-2xl flex flex-col md:flex-row gap-4 items-end">
                <div class="w-full md:flex-1">
                    <label class="label-base">Check-in</label>
                    <input type="date" id="search-in" class="input-base text-slate-800" onchange="window.updateCheckoutMin()">
                </div>
                <div class="w-full md:flex-1">
                    <label class="label-base">Check-out</label>
                    <input type="date" id="search-out" class="input-base text-slate-800">
                </div>
                <div class="w-full md:w-32">
                    <label class="label-base">Guests</label>
                    <input type="number" id="search-pax" value="2" min="1" max="10" class="input-base text-center text-slate-800">
                </div>
                <button onclick="window.searchDates()" class="btn-primary w-full md:w-auto h-[48px] flex items-center justify-center gap-2">
                    <i data-lucide="search" size="18"></i> Search
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 py-24 w-full flex-1">
        <div id="loading-spinner" class="hidden py-20 text-center">
            <div class="spinner"></div>
            <p class="mt-6 font-mono font-bold text-slate-800 uppercase tracking-widest text-xs">Checking Live Availability...</p>
        </div>
        
        <div id="results-header" class="hidden mb-10 flex items-center justify-between border-b border-slate-200 pb-4">
            <h2 class="font-display text-3xl text-slate-800">Available Rooms</h2>
            <span id="results-summary" class="font-mono font-bold text-[11px] text-slate-500 uppercase tracking-widest"></span>
        </div>

        <div id="results-container" class="space-y-8">
            <!-- Room cards dynamically injected here -->
        </div>
    </div>

    <div id="checkout-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="bg-white border-b border-slate-200 p-5 flex justify-between items-center shrink-0">
                <h3 class="font-display text-2xl text-slate-800">Complete Booking</h3>
                <button onclick="window.closeCheckout()" class="p-2 hover:bg-slate-100 text-slate-500 hover:text-slate-800 rounded-full transition-colors cursor-pointer"><i data-lucide="x" size="20"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 md:p-8 flex flex-col md:flex-row gap-8 bg-slate-50">
                <div class="flex-1 space-y-5 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="font-mono font-black uppercase text-slate-800 text-[11px] tracking-widest border-b border-slate-100 pb-3">Guest Details</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="label-base">First Name</label><input type="text" id="guest-first" class="input-base uppercase"></div>
                        <div><label class="label-base">Last Name</label><input type="text" id="guest-last" class="input-base uppercase"></div>
                    </div>
                    <div><label class="label-base">Email Address</label><input type="email" id="guest-email" class="input-base"></div>
                    <div><label class="label-base">Phone Number</label><input type="tel" id="guest-phone" class="input-base"></div>
                    <div><label class="label-base">Special Requests</label><textarea id="guest-notes" rows="3" class="input-base resize-none"></textarea></div>
                </div>

                <div class="w-full md:w-80 bg-slate-900 text-white p-6 rounded-xl shadow-lg h-fit space-y-6 shrink-0">
                    <h4 class="font-mono font-black uppercase text-slate-300 text-[11px] tracking-widest border-b border-slate-700 pb-3">Reservation Summary</h4>
                    <div id="checkout-summary" class="font-sans text-sm text-slate-200 space-y-3"></div>
                    <div class="border-t border-slate-700 pt-4 flex justify-between items-end">
                        <span class="font-mono font-bold uppercase text-slate-400 text-[10px] tracking-widest">Total Due</span>
                        <span id="checkout-total" class="font-display font-bold text-3xl text-white leading-none"></span>
                    </div>
                    <div id="checkout-warning" class="hidden text-[11px] font-sans text-amber-200 bg-amber-900/30 p-3 rounded-lg border border-amber-700/50 leading-relaxed"></div>
                    <button onclick="window.confirmBooking()" id="confirm-btn" class="w-full py-4 bg-white hover:bg-slate-200 text-slate-900 rounded-lg font-mono font-black text-xs uppercase tracking-widest shadow-lg transition-colors flex items-center justify-center gap-2 mt-2">Confirm Booking</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, getDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCyz--TlQZf_d-YNxhtGCV29LuFoRBfEeU", authDomain: "swimspms.firebaseapp.com", projectId: "swimspms", storageBucket: "swimspms.firebasestorage.app", messagingSenderId: "989960113115", appId: "1:989960113115:web:a99e08a23a36ff4289f5fe" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const appId = 'hotel-pms-v1';
        const BASE_IMG_URL = "https://loren-6q.github.io/SWIMSPMS/pics/";

        // State
        let liveStaff = [];
        let livePricing = { timeline: {}, relationships: [] };
        let selectedRoomData = null;

        // Canonical Room Data (Images updated to match user uploads)
        const roomMetaData = {
            "Oceanfront King": { img: `${BASE_IMG_URL}King.jpg`, price: 3500, desc: "Private beachfront suite with stunning sunrise views.", pax: 2 },
            "Oceanfront Twin": { img: `${BASE_IMG_URL}Twin.jpg`, price: 3500, desc: "Private beachfront suite with two single beds.", pax: 2 },
            "Oceanview King": { img: `${BASE_IMG_URL}OVKing.jpg`, price: 2800, desc: "Beautiful elevated sea views and private balcony.", pax: 2 },
            "Oceanview Twin": { img: `${BASE_IMG_URL}Twin.jpg`, price: 2800, desc: "Beautiful elevated sea views and private balcony.", pax: 2 },
            "Partial Oceanview King": { img: `${BASE_IMG_URL}King.jpg`, price: 2400, desc: "Glimpses of the ocean with a plush king bed.", pax: 2 },
            "Partial Oceanview Twin": { img: `${BASE_IMG_URL}Twin.jpg`, price: 2400, desc: "Glimpses of the ocean with two twin beds.", pax: 2 },
            "Gardenview King": { img: `${BASE_IMG_URL}King.jpg`, price: 2000, desc: "Quiet garden views with a plush king bed.", pax: 2 },
            "Gardenview Twin": { img: `${BASE_IMG_URL}Twin.jpg`, price: 2000, desc: "Quiet garden views with two twin beds.", pax: 2 },
            "Partial Oceanview Triple (King+Twin)": { img: `${BASE_IMG_URL}TripleKingTwin.jpg`, price: 3000, desc: "Perfect for groups of three with a King bed, a single bed, and partial ocean views.", pax: 3 },
            "Partial Oceanview Triple (Bunk+Twin)": { img: `${BASE_IMG_URL}TripleBunkTwin.jpg`, price: 3000, desc: "Perfect for groups of three with a bunk bed, a single bed, and partial ocean views.", pax: 3 },
            "Standard Quad Dorm": { img: `${BASE_IMG_URL}QuadDorm.jpg`, price: 450, desc: "4-bed mixed dorm with privacy curtains.", pax: 1 },
            "BUNGALOWS": { img: `${BASE_IMG_URL}CoverPhoto.jpg`, price: 1800, desc: "Private slice of paradise nestled in our tropical gardens.", pax: 2 }
        };

        const rawRoomsData = "B01|Oceanfront King^A01|Oceanfront King^A02|Oceanfront King^B02|Oceanfront Twin^B03|Oceanview King Room^B05|Oceanview King Room^B07|Oceanview King Room^A03|Oceanview King Room^A04|Oceanview King Room^A06|Oceanview King Room^A08|Oceanview King Room^A10|Oceanview King Room^A12|Oceanview King Room^C206|Oceanview King Room^C306|Oceanview King Room^C311|Oceanview King Room^B04|Oceanview Twin Room^B06|Oceanview Twin Room^B08|Oceanview Twin Room^C212|Oceanview Twin Room^A05|Partial Oceanview King Room^A07|Partial Oceanview King Room^A09|Partial Oceanview King Room^A11|Partial Oceanview King Room^C203|Partial Oceanview King Room^C204|Partial Oceanview King Room^C205|Partial Oceanview King Room^B09|Gardenview King Room^B11|Gardenview King Room^B13|Gardenview King Room^B15|Gardenview King Room^B17|Gardenview King Room^B19|Gardenview King Room^B21|Gardenview King Room^B22|Gardenview King Room^B10|Gardenview Twin Room^B12|Gardenview Twin Room^B14|Gardenview Twin Room^B16|Gardenview Twin Room^B18|Gardenview Twin Room^B20|Gardenview Twin Room^C201|Gardenview Twin Room^C202|Gardenview Twin Room^C207|Gardenview Twin Room^C208|Gardenview Twin Room^C209|Gardenview Twin Room^C210|Gardenview Twin Room^C211|Gardenview Twin Room^C101|Gardenview Twin Room^C307|Partial Oceanview Triple (Bunk+Twin)^C308|Partial Oceanview Triple (Bunk+Twin)^C305|Partial Oceanview Triple (King+Twin)^C309|Partial Oceanview Triple (King+Twin)^C310|Partial Oceanview Triple (King+Twin)^C301-1|Standard Quad Dorm^C301-2|Standard Quad Dorm^C301-3|Standard Quad Dorm^C301-4|Standard Quad Dorm^C302-1|Standard Quad Dorm|C302-2|Standard Quad Dorm^C302-3|Standard Quad Dorm^C302-4|Standard Quad Dorm^C303-1|Standard Quad Dorm^C303-2|Standard Quad Dorm^C303-3|Standard Quad Dorm^C303-4|Standard Quad Dorm^C304-1|Standard Quad Dorm^C304-2|Standard Quad Dorm^C304-3|Standard Quad Dorm^C304-4|Standard Quad Dorm^D01|BUNGALOWS^D02|BUNGALOWS^D03|BUNGALOWS^D04|BUNGALOWS^D05|BUNGALOWS^D06|BUNGALOWS^D07|BUNGALOWS^D08|BUNGALOWS^D09|BUNGALOWS^D10|BUNGALOWS^D11|BUNGALOWS";
        const hotelRooms = rawRoomsData.split('^').map(r => { const p = r.split('|'); return { id: p[0], type: p[1] }; });
        
        const getCanonicalName = (t) => {
            if (!t) return "Unknown";
            let stripped = t.replace(/\s+Room$/i, '').trim();
            if (stripped.includes('Triple')) return stripped; // Fallback handles the new explicit names
            if (stripped.includes('Quad') || stripped.includes('Dorm')) return "Standard Quad Dorm";
            if (stripped === 'BUNGALOWS') return "BUNGALOWS";
            return stripped; // e.g. "Oceanview King" matches the database pricing keys perfectly
        };

        const roomTypes = [...new Set(hotelRooms.map(r => getCanonicalName(r.type)))];

        // Safely converts database room names (e.g. B3) to UI names (e.g. B03) to match hotelRooms
        const dbToUiRoom = (rid) => {
            if (!rid) return rid; let nid = rid.toUpperCase();
            if (/^[ABFD]\d$/.test(nid)) return nid[0] + '0' + nid.substring(1);
            if (/^(101|[23]\d{2}(?:-\d)?)$/.test(nid)) return 'C' + nid;
            return nid;
        };

        // Bulletproof Date Functions locked to Thai Timezone
        const getThaiTodayStr = (offsetDays = 0) => {
            const now = new Date();
            const thaiOptions = { timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit' };
            const parts = new Intl.DateTimeFormat('en-US', thaiOptions).formatToParts(now);
            const y = parts.find(p => p.type === 'year').value;
            const m = parts.find(p => p.type === 'month').value;
            const d = parts.find(p => p.type === 'day').value;
            const baseDate = new Date(`${y}-${m}-${d}T12:00:00Z`);
            baseDate.setUTCDate(baseDate.getUTCDate() + offsetDays);
            return `${baseDate.getUTCFullYear()}-${String(baseDate.getUTCMonth()+1).padStart(2,'0')}-${String(baseDate.getUTCDate()).padStart(2,'0')}`;
        };

        const parseYMD = (str) => { 
            if(!str) return 0; 
            const p = str.split('-'); 
            return Date.UTC(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2])); 
        };

        window.onload = async () => {
            lucide.createIcons();
            const todayStr = getThaiTodayStr(0);
            const tmrwStr = getThaiTodayStr(1);
            document.getElementById('search-in').value = todayStr;
            document.getElementById('search-in').min = todayStr;
            document.getElementById('search-out').value = tmrwStr;
            document.getElementById('search-out').min = tmrwStr;

            try {
                await signInAnonymously(auth);
                const [staffSnap, priceSnap] = await Promise.all([
                    getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'staff')),
                    getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pricing', 'master_v4'))
                ]);
                liveStaff = staffSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                if (priceSnap.exists()) {
                    const d = priceSnap.data();
                    livePricing.timeline = d.timeline || {};
                    livePricing.relationships = d.relationships || [];
                }
            } catch (err) {
                console.error("Firebase connection failed. Using fallback data.", err);
            }
        };

        window.updateCheckoutMin = () => {
            const inDate = document.getElementById('search-in').value;
            if (inDate) {
                const outEl = document.getElementById('search-out');
                const parts = inDate.split('-');
                const nextDay = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T12:00:00Z`);
                nextDay.setUTCDate(nextDay.getUTCDate() + 1);
                const minOut = `${nextDay.getUTCFullYear()}-${String(nextDay.getUTCMonth()+1).padStart(2,'0')}-${String(nextDay.getUTCDate()).padStart(2,'0')}`;
                outEl.min = minOut;
                if (outEl.value <= inDate) outEl.value = minOut;
            }
        };

        window.searchDates = () => {
            const cIn = document.getElementById('search-in').value;
            const cOut = document.getElementById('search-out').value;
            const pax = parseInt(document.getElementById('search-pax').value) || 2;

            if (!cIn || !cOut || cIn >= cOut) return alert("Please select valid check-in and check-out dates.");

            document.getElementById('loading-spinner').classList.remove('hidden');
            document.getElementById('results-header').classList.add('hidden');
            document.getElementById('results-container').innerHTML = '';
            document.getElementById('search-widget').scrollIntoView({behavior: 'smooth', block: 'start'});

            setTimeout(() => {
                const results = calculateAvailabilityAndPricing(cIn, cOut, pax);
                renderResults(results, cIn, cOut, pax);
            }, 600);
        };

        const calculateAvailabilityAndPricing = (cIn, cOut, requestedPax) => {
            const inMs = parseYMD(cIn);
            const outMs = parseYMD(cOut);
            const nights = Math.round((outMs - inMs) / 86400000);
            
            // 1. Calculate Live Inventory
            const occupied = new Set();
            liveStaff.forEach(s => {
                // PMS explicitly ignores unconfirmed, cancelled, and noshow for availability checks
                if (['cancelled', 'noshow', 'unconfirmed'].includes(s.status)) return;
                if (s.status === 'special' && (!s.rooms || s.rooms.length === 0 || s.rooms[0] === "")) return;
                
                if (inMs < parseYMD(s.checkOut) && outMs > parseYMD(s.checkIn)) {
                    const rList = s.rooms?.length ? s.rooms : (s.room ? [s.room] : []);
                    rList.forEach(r => { if(r) occupied.add(dbToUiRoom(r)); });
                }
            });

            const availCounts = {};
            hotelRooms.forEach(r => {
                if (!occupied.has(r.id)) {
                    const canonical = getCanonicalName(r.type);
                    availCounts[canonical] = (availCounts[canonical] || 0) + 1;
                }
            });

            // 2. Loop Days & Calculate Rate Fencing
            const results = [];
            roomTypes.forEach(t => {
                const count = availCounts[t] || 0;
                const meta = roomMetaData[t];
                if (!meta || count === 0 || meta.pax < requestedPax) return; // Must have capacity

                let qualifiesForFmp = true;
                let totalStd = 0;
                let totalFmp = 0;

                for (let i = 0; i < nights; i++) {
                    const parts = cIn.split('-');
                    const d = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T12:00:00Z`);
                    d.setUTCDate(d.getUTCDate() + i);
                    const dStr = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
                    
                    const dayData = livePricing.timeline[dStr] || {};
                    const rData = dayData[t] || {};
                    const gData = dayData['GLOBAL'] || {};

                    let dayStd = rData.std || meta.price;
                    let dayFmp = rData.fmp || dayStd;

                    totalStd += dayStd;
                    totalFmp += dayFmp;

                    if (gData.cta && i === 0) qualifiesForFmp = false;
                    if (gData.min && nights < gData.min) qualifiesForFmp = false;
                    if (gData.min_arr && nights < gData.min_arr && i === 0) qualifiesForFmp = false;
                }

                if (totalFmp === 0 || isNaN(totalFmp)) qualifiesForFmp = false;

                const finalTotal = qualifiesForFmp ? totalFmp : totalStd;
                const avgNightly = Math.round(finalTotal / nights);

                results.push({
                    type: t,
                    avail: count,
                    meta: meta,
                    total: finalTotal,
                    avg: avgNightly,
                    qualifiesForFmp: qualifiesForFmp,
                    nights: nights
                });
            });

            return results.sort((a, b) => a.total - b.total);
        };

        const renderResults = (results, cIn, cOut, pax) => {
            const container = document.getElementById('results-container');
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('results-header').classList.remove('hidden');
            
            // Format dates nicely for header
            const fIn = new Date(`${cIn.split('-')[0]}-${cIn.split('-')[1]}-${cIn.split('-')[2]}T12:00:00Z`).toLocaleDateString('en-US', {month:'short', day:'numeric'});
            const fOut = new Date(`${cOut.split('-')[0]}-${cOut.split('-')[1]}-${cOut.split('-')[2]}T12:00:00Z`).toLocaleDateString('en-US', {month:'short', day:'numeric'});
            document.getElementById('results-summary').innerText = `${fIn} to ${fOut} • ${pax} Guest${pax>1?'s':''}`;

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-24 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <i data-lucide="calendar-x" size="48" class="mx-auto text-slate-300 mb-4"></i>
                        <h3 class="font-display text-2xl text-slate-800 mb-2">No Rooms Available</h3>
                        <p class="text-slate-500 font-sans">Try adjusting your dates or guest count.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            let html = '';
            results.forEach(res => {
                const isDorm = res.type.includes('Dorm');
                const tagLabel = isDorm ? 'Per Bed' : 'Per Room';
                const fmpWarning = res.qualifiesForFmp ? '' : `<div class="text-[10px] text-amber-700 bg-amber-50 px-2.5 py-1.5 rounded-md font-sans font-semibold mt-3 inline-flex items-center gap-1.5 border border-amber-200/60"><i data-lucide="info" size="12"></i> Standard Rate Applied (Min. Stay Not Met)</div>`;

                html += `
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col md:flex-row shadow-sm hover:shadow-xl transition-all duration-300 group">
                        <div class="md:w-5/12 h-64 md:h-auto relative overflow-hidden bg-slate-900">
                            <img src="${res.meta.img}" onerror="this.src='${BASE_IMG_URL}CoverPhoto.jpg'" alt="${res.type}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 opacity-90 group-hover:opacity-100">
                            <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1.5 rounded-md text-[10px] font-mono font-black uppercase tracking-widest text-slate-900 shadow-sm">
                                ${res.avail} Left
                            </div>
                        </div>
                        <div class="p-6 md:p-8 md:w-7/12 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <h3 class="font-display text-2xl text-slate-800 leading-tight pr-4">${res.type}</h3>
                                    <div class="text-right shrink-0">
                                        <div class="text-2xl font-sans font-bold text-slate-900 leading-none">฿${res.avg.toLocaleString()}</div>
                                        <div class="text-[9px] font-mono font-bold text-slate-500 uppercase tracking-widest mt-1.5">Avg / Night</div>
                                    </div>
                                </div>
                                <p class="text-sm font-sans text-slate-600 mb-6 leading-relaxed">${res.meta.desc}</p>
                                <div class="flex flex-wrap items-center gap-4 text-[11px] font-mono font-bold text-slate-500 uppercase tracking-wider mb-2">
                                    <span class="flex items-center gap-1.5"><i data-lucide="users" size="14"></i> Sleeps ${res.meta.pax}</span>
                                    <span class="flex items-center gap-1.5"><i data-lucide="wifi" size="14"></i> Free Wifi</span>
                                    <span class="flex items-center gap-1.5"><i data-lucide="waves" size="14"></i> Pool Access</span>
                                </div>
                                ${fmpWarning}
                            </div>
                            <div class="border-t border-slate-100 pt-5 mt-6 flex items-center justify-between">
                                <div>
                                    <div class="text-[10px] font-mono font-black text-slate-500 uppercase tracking-widest mb-1">${res.nights} Nights Total</div>
                                    <div class="text-xl font-sans font-bold text-slate-900">฿${res.total.toLocaleString()}</div>
                                </div>
                                <button onclick='window.openCheckout(${JSON.stringify(res).replace(/'/g, "&#39;")}, "${cIn}", "${cOut}", ${pax})' class="btn-primary !px-10">Select</button>
                            </div>
                        </div>
                    </div>`;
            });

            container.innerHTML = html;
            lucide.createIcons();
        };

        window.openCheckout = (roomData, cIn, cOut, pax) => {
            selectedRoomData = { ...roomData, cIn, cOut, pax };
            
            const fIn = new Date(`${cIn.split('-')[0]}-${cIn.split('-')[1]}-${cIn.split('-')[2]}T12:00:00Z`).toLocaleDateString('en-US', {month:'short', day:'numeric'});
            const fOut = new Date(`${cOut.split('-')[0]}-${cOut.split('-')[1]}-${cOut.split('-')[2]}T12:00:00Z`).toLocaleDateString('en-US', {month:'short', day:'numeric'});

            document.getElementById('checkout-summary').innerHTML = `
                <div class="flex justify-between border-b border-slate-700/50 pb-2"><span>Check-in</span> <span class="text-white font-semibold">${fIn}</span></div>
                <div class="flex justify-between border-b border-slate-700/50 pb-2 pt-1"><span>Check-out</span> <span class="text-white font-semibold">${fOut}</span></div>
                <div class="flex justify-between border-b border-slate-700/50 pb-2 pt-1"><span>Guests</span> <span class="text-white font-semibold">${pax}</span></div>
                <div class="flex justify-between border-b border-slate-700/50 pb-2 pt-1"><span>Room</span> <span class="text-white font-semibold text-right">${roomData.type}</span></div>
                <div class="flex justify-between pt-1"><span>Nights</span> <span class="text-white font-semibold">${roomData.nights}</span></div>
            `;
            
            document.getElementById('checkout-total').innerText = `฿${roomData.total.toLocaleString()}`;
            
            const warnEl = document.getElementById('checkout-warning');
            if (!roomData.qualifiesForFmp) {
                warnEl.innerHTML = "<strong>Notice:</strong> Your dates intersect a Full Moon Party but do not meet the minimum stay requirement for the package rate. Standard premium rates apply.";
                warnEl.classList.remove('hidden');
            } else {
                warnEl.classList.add('hidden');
            }

            document.getElementById('checkout-modal').classList.remove('hidden');
        };

        window.closeCheckout = () => {
            document.getElementById('checkout-modal').classList.add('hidden');
        };

        window.confirmBooking = async () => {
            const first = document.getElementById('guest-first').value.trim();
            const last = document.getElementById('guest-last').value.trim();
            const email = document.getElementById('guest-email').value.trim();
            
            if (!first || !last || !email) return alert("Please fill out your Name and Email.");

            const btn = document.getElementById('confirm-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner !w-5 !h-5 !border-2 !border-t-slate-900"></div> Processing...';

            const bookingId = Math.random().toString(36).substr(2, 9).toUpperCase();
            const payload = {
                id: bookingId,
                firstName: first.toUpperCase(),
                lastName: last.toUpperCase(),
                email: email,
                phone: document.getElementById('guest-phone').value.trim(),
                notes: document.getElementById('guest-notes').value.trim(),
                checkIn: selectedRoomData.cIn,
                checkOut: selectedRoomData.cOut,
                pax: selectedRoomData.pax,
                bookedType: selectedRoomData.type,
                room: "", // Unassigned
                rooms: [""],
                status: "unconfirmed", // Safely drops into PMS as unconfirmed
                source: "direct",
                totalPrice: selectedRoomData.total,
                netPrice: selectedRoomData.total,
                payments: [],
                createdAt: new Date().toISOString(),
                createdBy: "Direct Booking Engine"
            };

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'staff', bookingId), payload);
                
                document.getElementById('checkout-modal').innerHTML = `
                    <div class="bg-white rounded-2xl p-10 max-w-md w-full text-center shadow-2xl mx-auto my-auto border border-slate-200">
                        <i data-lucide="check-circle" size="64" class="mx-auto text-emerald-500 mb-6"></i>
                        <h2 class="font-display text-4xl text-slate-800 mb-4">Request Sent!</h2>
                        <p class="font-sans text-slate-600 mb-8 leading-relaxed">Your booking ID is <span class="text-slate-900 font-bold bg-slate-100 px-2 py-1 rounded mx-1">${bookingId}</span><br><br>Our team will review your request and send a secure payment link to your email to confirm the reservation.</p>
                        <button onclick="location.reload()" class="btn-primary w-full">Return Home</button>
                    </div>`;
                lucide.createIcons();
            } catch (err) {
                console.error("Booking Error:", err);
                alert("Failed to submit booking. Please try again.");
                btn.disabled = false;
                btn.innerHTML = 'Confirm Booking';
            }
        };
    </script>
</body>
</html>
